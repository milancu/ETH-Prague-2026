services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:?VITE_WALLETCONNECT_PROJECT_ID is required}
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    ports:
      - "3001:80"
    restart: unless-stopped